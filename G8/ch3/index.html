<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Grade 8 Algebraic Expressions Game</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#f7fbff 0%,#eef9ff 48%,#fff7e6 100%);color:#243042}
button{font-family:inherit}
#splash{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10000;transition:.55s}
#splash img{width:min(310px,72vw);height:auto;animation:logoPulse 1.8s ease-in-out infinite}
@keyframes logoPulse{50%{transform:scale(1.04)}}

#app{height:100vh;height:100dvh;width:100%;max-width:980px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:10px;opacity:0;transition:.45s}
.screen{height:100%;min-height:0;display:none}
.active{display:flex}
.center{align-items:center;justify-content:center}

.card{width:min(650px,94vw);background:rgba(255,255,255,.92);border:2px solid #9bd8ff;border-radius:24px;box-shadow:0 18px 45px rgba(52,129,173,.16);padding:clamp(20px,4vw,32px);text-align:center}
.card h1{font-size:clamp(1.55rem,5vw,2.2rem);color:#1267a8;margin-bottom:8px}
.card p{font-size:clamp(.95rem,2.8vw,1.08rem);line-height:1.55;color:#415166;margin:10px auto 18px}
.btn{border:0;border-radius:18px;padding:13px 24px;background:linear-gradient(135deg,#22b8ff,#ffb445);color:#112033;font-weight:900;font-size:clamp(.95rem,2.8vw,1.07rem);cursor:pointer;box-shadow:0 9px 0 #d58624,0 18px 26px rgba(255,180,69,.22);transition:.16s}
.btn:active{transform:translateY(4px);box-shadow:0 5px 0 #d58624}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center}
.pill{background:#fff;border:2px solid #bde8ff;border-radius:18px;padding:8px 12px;font-size:clamp(.8rem,2.2vw,.98rem);font-weight:900;color:#13537b;box-shadow:0 4px 12px rgba(52,129,173,.09);text-align:center;white-space:nowrap}

#game{flex-direction:column;min-height:0}
.gamegrid{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:10px}
.panel{background:rgba(255,255,255,.88);border:2px solid #bde8ff;border-radius:22px;box-shadow:0 14px 28px rgba(52,129,173,.14);padding:12px;min-height:0;min-width:0}
.scene{position:relative;overflow:hidden;background:linear-gradient(#dff5ff,#fff7dc);border-color:#ffd28a;padding:0}
.qpanel{display:flex;flex-direction:column;gap:9px;overflow:hidden}

.question{background:#f6fcff;border:2px solid #87d8ff;border-radius:18px;padding:13px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,3.2vw,1.35rem);font-weight:900;line-height:1.35;color:#192b3f}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.opt{min-height:54px;border:2px solid #ffd28a;border-radius:16px;background:#fffdf7;color:#273647;font-weight:900;font-size:clamp(.88rem,2.5vw,1.05rem);cursor:pointer;padding:9px;box-shadow:0 4px 12px rgba(205,129,20,.08);transition:.18s;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.opt:hover{transform:translateY(-1px)}}
.opt.selected{border-color:#ff9f1c;background:#fff0cc;box-shadow:0 0 0 3px rgba(255,159,28,.18)}
.opt.correct{border-color:#16a34a!important;background:#dcfce7!important}
.opt.wrong{border-color:#dc2626!important;background:#fee2e2!important}
.feedback{min-height:44px;text-align:center;font-size:clamp(.84rem,2.3vw,.96rem);font-weight:800;line-height:1.35;color:#475569;display:flex;align-items:center;justify-content:center;padding:0 4px}
.submit{width:100%;margin-top:auto}

canvas{width:100%;height:100%;display:block}
.progress{height:12px;border-radius:30px;background:#e8f6ff;overflow:hidden;border:1px solid #cdefff}
.bar{height:100%;width:0;background:linear-gradient(90deg,#22b8ff,#ffb445);transition:.35s}

.reward-pop{position:absolute;left:50%;top:10px;transform:translateX(-50%) scale(.8);opacity:0;z-index:3;background:rgba(255,255,255,.96);border:2px solid #58c57a;border-radius:999px;padding:7px 13px;font-weight:900;color:#147a36;font-size:clamp(.78rem,2.7vw,.95rem);pointer-events:none;white-space:nowrap}
.reward-pop.show{animation:rewardPop 1.25s ease forwards}
@keyframes rewardPop{0%{opacity:0;transform:translateX(-50%) scale(.72)}18%,70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.94)}}

.spark{position:fixed;width:10px;height:10px;top:-12px;border-radius:50%;pointer-events:none;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(520deg);opacity:0}}

@media(max-width:760px){
  #app{padding:6px;gap:5px}
  .top{gap:4px}
  .pill{padding:6px 3px;border-radius:12px;font-size:clamp(.72rem,3vw,.86rem);border-width:1.5px}
  .progress{height:8px}
  .gamegrid{grid-template-columns:1fr;grid-template-rows:minmax(135px,30%) minmax(0,1fr);gap:6px}
  .scene{min-height:135px;border-radius:16px}
  .qpanel{padding:8px;gap:6px;border-radius:16px}
  .question{min-height:58px;padding:8px 7px;border-radius:13px;font-size:clamp(.9rem,3.9vw,1.03rem);line-height:1.24}
  .opts{gap:6px}
  .opt{min-height:44px;padding:6px 5px;border-radius:12px;font-size:clamp(.76rem,3.35vw,.9rem);line-height:1.16}
  .feedback{min-height:34px;font-size:clamp(.73rem,3vw,.84rem);line-height:1.2}
  .submit{padding:9px 14px;border-radius:13px;box-shadow:0 5px 0 #d58624;font-size:.9rem}
  .reward-pop{top:6px;padding:5px 10px}
}
@media(max-width:390px){
  .top{gap:3px}
  .pill{padding:5px 2px;font-size:.72rem}
  .gamegrid{grid-template-rows:minmax(125px,28%) minmax(0,1fr)}
  .scene{min-height:125px}
  .qpanel{padding:7px;gap:5px}
  .question{min-height:52px;font-size:.88rem;padding:6px}
  .opts{gap:5px}
  .opt{min-height:41px;padding:5px 4px;font-size:.76rem}
  .feedback{min-height:30px;font-size:.72rem}
  .submit{padding:8px 12px;font-size:.84rem}
}
@media(max-height:650px) and (orientation:portrait){
  #app{padding:5px;gap:4px}
  .pill{padding:4px 2px}
  .progress{height:7px}
  .gamegrid{grid-template-rows:108px minmax(0,1fr);gap:5px}
  .scene{min-height:108px}
  .qpanel{padding:6px;gap:4px}
  .question{min-height:44px;padding:5px;font-size:.82rem;line-height:1.16}
  .opt{min-height:36px;padding:4px 3px;font-size:.7rem;line-height:1.1}
  .feedback{min-height:25px;font-size:.67rem;line-height:1.12}
  .submit{padding:7px 10px;font-size:.78rem}
}
@media(orientation:landscape) and (max-height:520px){
  #app{padding:5px;gap:4px}
  .gamegrid{grid-template-columns:.9fr 1.1fr;grid-template-rows:1fr;gap:6px}
  .scene{min-height:0}
  .qpanel{padding:7px;gap:5px}
  .question{min-height:48px;padding:6px;font-size:.88rem}
  .opt{min-height:37px;padding:4px;font-size:.74rem}
  .feedback{min-height:26px;font-size:.7rem}
  .submit{padding:7px 12px;font-size:.82rem}
  .card{width:min(560px,92vw)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<audio id="sndCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="sndWrong" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="sndClap" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>
<div id="splash"><img src="assets/innovine-logo.png" alt="Innovine Logo"></div>
<div id="app">
  <section id="intro" class="screen active center">
    <div class="card">
      <h1>Algebra Arcade</h1>
      <p><b>Grade 8 Mathematics</b><br>Simplify, expand, evaluate, and reason with algebraic expressions to power the arcade machine.</p>
      <button class="btn" onclick="startGame()">Start Game</button>
    </div>
  </section>
  <section id="game" class="screen">
    <div class="top">
      <div class="pill">🎮 Level <span id="level">1</span>/10</div>
      <div class="pill">⭐ Score <span id="score">0</span></div>
      <div class="pill">⚡ Power <span id="power">100</span>%</div>
    </div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="gamegrid">
      <div class="panel scene"><canvas id="canvas"></canvas><div id="rewardPop" class="reward-pop" aria-live="polite"></div></div>
      <div class="panel qpanel">
        <div id="question" class="question"></div>
        <div class="opts">
          <button class="opt" onclick="choose(0)"></button>
          <button class="opt" onclick="choose(1)"></button>
          <button class="opt" onclick="choose(2)"></button>
          <button class="opt" onclick="choose(3)"></button>
        </div>
        <div id="feedback" class="feedback">Choose an answer to power the machine.</div>
        <button id="submit" class="btn submit" onclick="submitAnswer()">Power Machine</button>
      </div>
    </div>
  </section>
  <section id="end" class="screen center">
    <div class="card">
      <h1>🏆 Arcade Powered!</h1>
      <p id="resultText"></p>
      <button class="btn" onclick="location.reload()">Play Again</button>
    </div>
  </section>
</div>
<script>
const rawQuestions=[
{q:'Simplify: 5x + 3 - 2x + 7',a:'3x + 10',w:['7x + 10','3x + 4','7x + 4'],e:'Combine like terms: 5x - 2x = 3x and 3 + 7 = 10.'},
{q:'If a = -2 and b = 3, find the value of 2a² - ab + b².',a:'23',w:['11','17','29'],e:'2(4) - (-6) + 9 = 8 + 6 + 9 = 23.'},
{q:'Subtract (3a² - 2a + 5) from (5a² + a - 4).',a:'2a² + 3a - 9',w:['2a² - a + 1','8a² - a + 1','2a² + 3a + 1'],e:'(5a² + a - 4) - (3a² - 2a + 5) = 2a² + 3a - 9.'},
{q:'Simplify: 3x(2x - 5) + 4x(x + 1).',a:'10x² - 11x',w:['10x² - x','6x² - 11x','10x² + 19x'],e:'Expand first: 6x² - 15x + 4x² + 4x = 10x² - 11x.'},
{q:'Which expression is equivalent to (x + 4)(x - 3)?',a:'x² + x - 12',w:['x² - x - 12','x² + 7x - 12','x² + x + 12'],e:'Multiply term by term: x² - 3x + 4x - 12 = x² + x - 12.'},
{q:'A rectangle has length (3x + 2) cm and breadth (2x - 1) cm. What is its perimeter?',a:'10x + 2',w:['5x + 1','10x + 6','6x² + x - 2'],e:'Perimeter = 2[(3x + 2) + (2x - 1)] = 2(5x + 1) = 10x + 2.'},
{q:'Using an algebraic identity, find 103².',a:'10609',w:['10309','10690','10906'],e:'103² = (100 + 3)² = 10000 + 600 + 9 = 10609.'},
{q:'What is the coefficient of xy in (2x + 3y)(x - 4y)?',a:'-5',w:['-8','3','5'],e:'The xy terms are -8xy + 3xy, so the coefficient is -5.'},
{q:'A student writes 4(2x - 3) + x = 9x - 12. Which statement is correct?',a:'The expression should simplify to 9x - 12',w:['It should simplify to 8x - 12','It should simplify to 9x - 3','It should simplify to 8x + 9'],e:'4(2x - 3) + x = 8x - 12 + x = 9x - 12, so the student is correct.'},
{q:'Simplify completely: 5m - 2(3m - 4) + (m + 1).',a:'9',w:['2m + 9','-2m + 9','9m'],e:'5m - 6m + 8 + m + 1 = 0m + 9 = 9.'}
];
let questions=[],current=0,score=0,power=100,attempt=0,selected=null,locked=false,opts=[];let c,ctx,anim={belt:0,boxX:-70,scan:0,shake:0,glow:0};
setTimeout(()=>{document.getElementById('splash').style.opacity='0';setTimeout(()=>{document.getElementById('splash').remove();document.getElementById('app').style.opacity='1'},550)},5000);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){questions=[...rawQuestions];show('game');c=document.getElementById('canvas');ctx=c.getContext('2d');resize();addEventListener('resize',resize);loadQuestion();requestAnimationFrame(loop)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function resize(){let r=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width));c.height=Math.max(1,Math.floor(r.height))}
function loadQuestion(){attempt=0;selected=null;locked=false;anim.boxX=-70;anim.scan=0;anim.glow=0;document.getElementById('rewardPop').className='reward-pop';document.getElementById('rewardPop').textContent='';document.getElementById('level').textContent=current+1;document.getElementById('score').textContent=score;document.getElementById('power').textContent=power;document.getElementById('bar').style.width=(current*10)+'%';document.getElementById('question').textContent=questions[current].q;document.getElementById('feedback').textContent='Choose the best answer.';document.getElementById('feedback').style.color='#475569';document.getElementById('submit').disabled=false;opts=shuffle([{t:questions[current].a,ok:true},...questions[current].w.map(x=>({t:x,ok:false}))]);document.querySelectorAll('.opt').forEach((b,i)=>{b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+opts[i].t;b.disabled=false})}
function choose(i){if(locked)return;selected=i;document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('selected',k===i))}
function play(id){let s=document.getElementById(id);s.currentTime=0;s.play().catch(()=>{})}
function submitAnswer(){if(selected===null||locked){document.getElementById('feedback').textContent='Please choose an answer first.';return}locked=true;document.getElementById('submit').disabled=true;anim.boxX=-60;moveBox(()=>check())}
function moveBox(cb){let target=Math.max(42,c.width*.42);let step=Math.max(7,c.width*.025);let timer=setInterval(()=>{anim.boxX+=step;if(anim.boxX>=target){clearInterval(timer);cb()}},25)}
function showReward(text){let r=document.getElementById('rewardPop');r.textContent=text;r.className='reward-pop';void r.offsetWidth;r.classList.add('show')}
function check(){let fb=document.getElementById('feedback'),buttons=document.querySelectorAll('.opt');if(opts[selected].ok){buttons[selected].classList.add('correct');score+=10;document.getElementById('score').textContent=score;anim.scan=34;anim.glow=70;let praise=attempt===0?'Excellent algebra thinking!':'Good recovery!';fb.textContent=praise+' '+questions[current].e;fb.style.color='#15803d';showReward(attempt===0?'⭐ +10 • First try!':'⭐ +10 • Correct!');play('sndCorrect');setTimeout(()=>play('sndClap'),170);confetti();setTimeout(()=>{current++;if(current>=10)finish();else loadQuestion()},2200)}else{attempt++;buttons[selected].classList.add('wrong');power=Math.max(0,power-10);document.getElementById('power').textContent=power;anim.shake=24;play('sndWrong');if(attempt<2){fb.textContent='Try once more. Check the signs, like terms, or expansion.';fb.style.color='#dc2626';setTimeout(()=>{locked=false;document.getElementById('submit').disabled=false;buttons[selected].classList.remove('selected');selected=null},850)}else{let correctIndex=opts.findIndex(o=>o.ok);buttons[correctIndex].classList.add('correct');fb.textContent='Correct answer: '+opts[correctIndex].t+'. '+questions[current].e;fb.style.color='#15803d';setTimeout(()=>{current++;if(current>=10)finish();else loadQuestion()},2800)}}}
function finish(){document.getElementById('bar').style.width='100%';show('end');document.getElementById('resultText').innerHTML='Final Score: <b>'+score+'/100</b><br>Power Left: <b>'+power+'%</b><br>You completed all 10 Algebraic Expressions challenges.';play('sndClap')}
function loop(){draw();requestAnimationFrame(loop)}
function draw(){if(!ctx)return;let w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#dff5ff';ctx.fillRect(0,0,w,h);
let s=Math.max(.48,Math.min(1,w/520,h/240));
for(let i=0;i<6;i++){ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();let cx=(i*130+anim.belt*.4)% (w+80)-40;let cy=Math.max(18,30*s)+i%2*Math.max(14,28*s);ctx.arc(cx,cy,18*s,0,Math.PI*2);ctx.arc(cx+20*s,cy-8*s,24*s,0,Math.PI*2);ctx.arc(cx+45*s,cy+2*s,18*s,0,Math.PI*2);ctx.fill()}
anim.belt=(anim.belt+1.8)%80;
let floor=h*.78;ctx.fillStyle='#fff1c7';ctx.fillRect(0,floor,w,h-floor);
ctx.fillStyle='#8dd3ff';ctx.fillRect(0,floor-28*s,w,38*s);
for(let x=-80+anim.belt;x<w+80;x+=80){ctx.fillStyle='#2388c8';ctx.fillRect(x,floor-19*s,50*s,7*s);ctx.beginPath();ctx.arc(x+10*s,floor+7*s,7*s,0,Math.PI*2);ctx.arc(x+42*s,floor+7*s,7*s,0,Math.PI*2);ctx.fill()}
let machineW=120*s,machineH=115*s, machineX=Math.min(w-machineW-8,Math.max(w*.56, w-machineW-24)), machineY=Math.max(6,floor-machineH-8);
drawMachine(machineX,machineY,s);
drawBox(anim.boxX,Math.max(8,floor-55*s),s);
if(anim.scan>0){anim.scan-=1.5;ctx.fillStyle='rgba(34,197,94,.23)';ctx.fillRect(machineX+52*s,machineY,20*s,machineH)}
if(anim.shake>0)anim.shake--;
if(anim.glow>0){anim.glow-=1.4;ctx.strokeStyle='rgba(34,197,94,.45)';ctx.lineWidth=Math.max(3,8*s);ctx.beginPath();ctx.arc(machineX+60*s,machineY+58*s,Math.max(24,68*s-anim.glow*.16*s),0,Math.PI*2);ctx.stroke()}}
function drawMachine(x,y,s){let shake=anim.shake?Math.sin(anim.shake)*5*s:0;x+=shake;ctx.fillStyle='#9bd8ff';round(x,y,120*s,115*s,18*s,true);ctx.strokeStyle='#2286c3';ctx.lineWidth=Math.max(1.5,3*s);round(x,y,120*s,115*s,18*s,false,true);ctx.fillStyle='#fff';round(x+22*s,y+20*s,76*s,45*s,12*s,true);ctx.fillStyle=anim.glow>0?'#22c55e':'#ffb445';ctx.beginPath();ctx.arc(x+60*s,y+43*s,18*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243042';ctx.font='bold '+Math.max(10,18*s)+'px sans-serif';ctx.textAlign='center';ctx.fillText('x',x+60*s,y+49*s);ctx.fillStyle='#ffb445';ctx.fillRect(x+22*s,y+82*s,76*s,16*s);ctx.fillStyle='#11608a';ctx.font='bold '+Math.max(8,13*s)+'px sans-serif';ctx.fillText('ALGEBRA',x+60*s,y+108*s)}
function drawBox(x,y,s){ctx.fillStyle='#f7b955';round(x,y,84*s,55*s,10*s,true);ctx.strokeStyle='#b86b15';ctx.lineWidth=Math.max(1.5,3*s);round(x,y,84*s,55*s,10*s,false,true);ctx.fillStyle='#7c3f10';ctx.font='bold '+Math.max(9,16*s)+'px sans-serif';ctx.textAlign='center';let label=selected===null?'?':opts[selected].t;fit(label,x+42*s,y+34*s,70*s)}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke()}
function fit(t,x,y,max){let size=16;ctx.font='bold '+size+'px sans-serif';while(ctx.measureText(t).width>max&&size>8){size--;ctx.font='bold '+size+'px sans-serif'}ctx.fillText(t,x,y)}
function confetti(){for(let i=0;i<20;i++){let d=document.createElement('div');d.className='spark';d.style.left=Math.random()*100+'vw';d.style.background=['#22b8ff','#ffb445','#22c55e','#ff6b6b'][Math.floor(Math.random()*4)];d.style.animationDelay=Math.random()*.25+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}}
</script>
</body>
</html>

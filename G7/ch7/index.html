<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quantity Quest: Comparing Quantities</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  color:#1e293b;
  background:linear-gradient(180deg,#fff7ed 0%,#fef3c7 38%,#dbeafe 100%);
  display:flex;
  justify-content:center;
  align-items:center
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background:
    radial-gradient(circle at 15% 15%,rgba(251,146,60,.32),transparent 22%),
    radial-gradient(circle at 82% 18%,rgba(96,165,250,.28),transparent 24%),
    radial-gradient(circle at 60% 85%,rgba(34,197,94,.18),transparent 26%),
    linear-gradient(135deg,rgba(37,99,235,.08) 1px,transparent 1px),
    linear-gradient(45deg,rgba(217,119,6,.08) 1px,transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px
}

#hard-splash{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity .5s ease
}

.splash-img{
  max-width:min(270px,72vw);
  height:auto;
  object-fit:contain
}

#viewport-root{
  width:100%;
  max-width:470px;
  height:100dvh;
  max-height:790px;
  display:flex;
  flex-direction:column;
  padding:clamp(10px,2.8vw,16px);
  gap:clamp(8px,2vw,12px);
  opacity:0;
  transition:opacity .5s ease;
  position:relative
}

#instruction-modal{
  position:absolute;
  inset:0;
  background:rgba(255,251,235,.96);
  z-index:5000;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  border-radius:18px
}

.ins-box{
  background:#fff;
  border:2px solid #f59e0b;
  padding:clamp(18px,5vw,26px);
  border-radius:20px;
  box-shadow:0 14px 35px rgba(146,64,14,.22)
}

.ins-title{
  font-size:clamp(1.25rem,5vw,1.6rem);
  color:#2563eb;
  font-weight:900;
  margin-bottom:12px
}

.ins-text{
  font-size:clamp(.88rem,3.6vw,1rem);
  color:#475569;
  line-height:1.55;
  margin-bottom:20px;
  text-align:left
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#1d4ed8;
  font-weight:900;
  font-size:clamp(.82rem,3.2vw,.98rem)
}

.header-card{
  background:rgba(255,255,255,.9);
  border:2px solid #60a5fa;
  border-radius:18px;
  padding:clamp(10px,2.4vw,14px);
  box-shadow:0 10px 24px rgba(37,99,235,.14);
  text-align:center
}

.ticker{
  background:#eff6ff;
  border:2px solid #2563eb;
  border-radius:13px;
  padding:clamp(10px,2.3vw,13px)
}

.ticker-title{
  font-size:clamp(.76rem,2.8vw,.9rem);
  font-weight:900;
  color:#2563eb;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:4px
}

.ticker-problem{
  font-size:clamp(.9rem,3.6vw,1.08rem);
  font-weight:750;
  color:#1e293b;
  line-height:1.35
}

.shop-frame{
  flex:1;
  min-height:210px;
  background:rgba(255,255,255,.76);
  border:2px solid #f59e0b;
  border-radius:18px;
  position:relative;
  overflow:hidden;
  box-shadow:inset 0 0 20px rgba(251,191,36,.13)
}

canvas{
  display:block;
  width:100%;
  height:100%
}

.status{
  min-height:24px;
  text-align:center;
  font-weight:850;
  font-size:clamp(.8rem,3vw,.92rem);
  color:#475569;
  line-height:1.25
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(7px,2vw,10px)
}

.opt{
  background:#fff;
  border:2px solid #bfdbfe;
  color:#1e293b;
  border-radius:14px;
  padding:clamp(10px,3vw,14px);
  font-size:clamp(.86rem,3.3vw,.98rem);
  font-weight:850;
  cursor:pointer;
  text-align:center;
  transition:.2s;
  min-height:44px
}

.opt:hover:not(:disabled){
  background:#f8fbff;
  border-color:#60a5fa
}

.opt.selected{
  background:#dbeafe;
  border-color:#2563eb;
  box-shadow:0 0 12px rgba(37,99,235,.25)
}

.opt.correct{
  background:#dcfce7!important;
  border-color:#16a34a!important;
  color:#166534
}

.opt.wrong{
  background:#fee2e2!important;
  border-color:#dc2626!important;
  color:#991b1b
}

.opt:disabled{
  cursor:not-allowed
}

.action-btn{
  width:100%;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  color:#fff;
  border:none;
  border-radius:15px;
  padding:clamp(12px,3.2vw,16px);
  font-size:clamp(.9rem,3.4vw,1rem);
  font-weight:950;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.7px;
  box-shadow:0 6px 16px rgba(37,99,235,.28)
}

.action-btn:disabled{
  background:#cbd5e1;
  color:#64748b;
  cursor:not-allowed;
  box-shadow:none
}

.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:10px;
  pointer-events:none;
  animation:fall 1.4s linear forwards
}

@keyframes fall{
  to{
    transform:translateY(105vh) rotate(720deg);
    opacity:0
  }
}

@media(max-width:390px){
  #viewport-root{gap:7px;padding:9px}
  .options{grid-template-columns:1fr;gap:7px}
  .shop-frame{min-height:190px}
  .header-card{padding:9px}
  .ticker{padding:9px}
}

@media(max-height:650px){
  #viewport-root{
    max-width:720px;
    max-height:none;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto 1fr auto auto;
    gap:8px
  }
  .top-row{grid-column:1/3}
  .header-card{grid-column:1/2}
  .shop-frame{grid-column:2/3;grid-row:2/6;min-height:300px}
  .status{grid-column:1/2}
  .options{grid-column:1/2}
  .action-btn{grid-column:1/2}
  #instruction-modal{position:fixed;border-radius:0}
}
</style>
</head>

<body>
<audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
<audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="s-claps" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="hard-splash"><img src="assets/innovine-logo.png" class="splash-img" alt="Innovine Logo"></div>

<div id="viewport-root">
  <div id="instruction-modal">
    <div class="ins-box">
      <h2 class="ins-title">Quantity Quest Rules</h2>
      <p class="ins-text">
        Read each Comparing Quantities challenge carefully. Select the correct value and then send the shopping cart to the checkout counter. Correct answers earn stars. You get two attempts for every question.
      </p>
      <button class="action-btn" onclick="dismissInstructions()">Start Quest</button>
    </div>
  </div>

  <div class="top-row">
    <span>Challenge: <span id="q-num">1</span>/10</span>
    <span>Stars: ⭐ <span id="score">0</span></span>
  </div>

  <div class="header-card">
    <div class="ticker">
      <div class="ticker-problem" id="lbl-task">Loading...</div>
    </div>
  </div>

  <div class="shop-frame"><canvas id="game-canvas"></canvas></div>

  <div class="status" id="status"></div>

  <div class="options">
    <button class="opt" id="opt-0" onclick="selectOption(0)">Loading...</button>
    <button class="opt" id="opt-1" onclick="selectOption(1)">Loading...</button>
    <button class="opt" id="opt-2" onclick="selectOption(2)">Loading...</button>
    <button class="opt" id="opt-3" onclick="selectOption(3)">Loading...</button>
  </div>

  <button class="action-btn" id="btn-launch" onclick="launchCart()" disabled>Send Cart to Checkout</button>
</div>

<script>
let canvas,ctx,currentQ,chosen=-1,answers=[],qIndex=0,score=0,locked=false,attempts=0;
let cart={progress:0,moving:false,crash:false,rot:0,ox:0,oy:0,timer:0};
const questions=[
{q:'A shirt costs ₹800. It is sold at a 25% discount. What is the discount amount?',ans:'₹200',w:['₹100','₹250','₹600'],exp:'25% of 800 = 200.'},
{q:'A book costs ₹250. Its price increases by 10%. What is the increase?',ans:'₹25',w:['₹10','₹20','₹275'],exp:'10% of 250 = 25.'},
{q:'Convert 3/4 into percentage.',ans:'75%',w:['34%','60%','80%'],exp:'3/4 = 0.75 = 75%.'},
{q:'Convert 0.35 into percentage.',ans:'35%',w:['3.5%','350%','30%'],exp:'0.35 × 100 = 35%.'},
{q:'There are 40 students. 60% are girls. How many girls are there?',ans:'24',w:['16','20','26'],exp:'60% of 40 = 24.'},
{q:'A pen marked ₹50 is sold for ₹45. What is the discount?',ans:'₹5',w:['₹10','₹45','₹95'],exp:'Discount = Marked Price - Selling Price = 50 - 45.'},
{q:'A toy bought for ₹300 is sold for ₹360. What is the profit?',ans:'₹60',w:['₹30','₹40','₹660'],exp:'Profit = Selling Price - Cost Price = 360 - 300.'},
{q:'A bag bought for ₹500 is sold for ₹450. What is the loss?',ans:'₹50',w:['₹45','₹100','₹950'],exp:'Loss = Cost Price - Selling Price = 500 - 450.'},
{q:'Find 20% of ₹750.',ans:'₹150',w:['₹75','₹125','₹200'],exp:'20% of 750 = 150.'},
{q:'Which of the following gives the greatest value?',ans:'40% of 200',w:['20% of 300','10% of 500','25% of 160'],exp:'40% of 200 = 80, which is greater than 60, 50 and 40.'}
];

setTimeout(()=>{
  const s=document.getElementById('hard-splash');
  s.style.opacity='0';
  setTimeout(()=>{
    s.remove();
    document.getElementById('viewport-root').style.opacity='1';
    init();
  },500)
},5000);

function init(){
  canvas=document.getElementById('game-canvas');
  ctx=canvas.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  shuffle(questions);
  loadQuestion();
  loop();
}

function resize(){
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(260,r.width);
  canvas.height=Math.max(180,r.height);
}

function dismissInstructions(){
  const m=document.getElementById('instruction-modal');
  if(m) m.remove();
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function loadQuestion(){
  locked=false;
  attempts=0;
  chosen=-1;
  currentQ=questions[qIndex];

  document.getElementById('q-num').innerText=qIndex+1;
  document.getElementById('lbl-task').innerText=currentQ.q;
  document.getElementById('status').innerText='';
  document.getElementById('status').style.color='#475569';
  document.getElementById('btn-launch').disabled=true;

  answers=shuffle([{t:currentQ.ans,c:true},...currentQ.w.map(x=>({t:x,c:false}))]);

  for(let i=0;i<4;i++){
    let b=document.getElementById('opt-'+i);
    b.className='opt';
    b.innerText=answers[i].t;
    b.disabled=false;
  }

  cart={progress:0,moving:false,crash:false,rot:0,ox:0,oy:0,timer:0};
}

function selectOption(i){
  if(cart.moving||cart.crash||locked) return;
  const btn=document.getElementById('opt-'+i);
  if(btn.disabled) return;
  chosen=i;
  for(let k=0;k<4;k++){
    document.getElementById('opt-'+k).classList.toggle('selected',k===i);
  }
  document.getElementById('btn-launch').disabled=false;
  document.getElementById('status').innerText='Answer selected. Send the cart to check out.';
  document.getElementById('status').style.color='#2563eb';
}

function launchCart(){
  if(chosen<0||cart.moving||cart.crash||locked) return;
  document.getElementById('btn-launch').disabled=true;
  cart.moving=true;
  document.getElementById('status').innerText='Cart is moving to the checkout counter...';
  document.getElementById('status').style.color='#2563eb';
}

function update(){
  if(cart.moving){
    cart.progress+=.018;
    if(cart.progress>=1){
      cart.progress=1;
      cart.moving=false;
      checkAnswer();
    }
  }

  if(cart.crash){
    cart.timer++;
    cart.rot+=.2;
    cart.ox+=1.3;
    cart.oy=Math.sin(cart.timer*.45)*7;

    if(cart.timer>55){
      cart.crash=false;
      cart.progress=0;
      cart.rot=0;
      cart.ox=0;
      cart.oy=0;
      cart.timer=0;
      chosen=-1;

      for(let k=0;k<4;k++){
        document.getElementById('opt-'+k).classList.remove('selected');
      }

      document.getElementById('btn-launch').disabled=true;
      document.getElementById('status').innerText='Try again. Select another answer.';
      document.getElementById('status').style.color='#dc2626';
    }
  }
}

function checkAnswer(){
  let st=document.getElementById('status');

  if(answers[chosen].c){
    document.getElementById('s-correct').play().catch(()=>{});
    document.getElementById('opt-'+chosen).classList.add('correct');
    score++;
    document.getElementById('score').innerText=score;
    st.innerText='Correct! '+currentQ.exp;
    st.style.color='#16a34a';
    confetti();
    locked=true;
    setTimeout(()=>{
      qIndex++;
      if(qIndex>=questions.length) finish();
      else loadQuestion();
    },1800);
  }else{
    attempts++;
    document.getElementById('s-wrong').play().catch(()=>{});
    const wrongBtn=document.getElementById('opt-'+chosen);
    wrongBtn.classList.remove('selected');
    wrongBtn.classList.add('wrong');
    wrongBtn.disabled=true;

    if(attempts<2){
      st.innerText='Not quite. Try another option.';
      st.style.color='#dc2626';
      cart.crash=true;
    }else{
      const correctIndex=answers.findIndex(a=>a.c);
      document.getElementById('opt-'+correctIndex).classList.add('correct');
      for(let k=0;k<4;k++){
        document.getElementById('opt-'+k).disabled=true;
      }
      st.innerText='Correct Answer: '+answers[correctIndex].t+' | '+currentQ.exp;
      st.style.color='#16a34a';
      locked=true;
      setTimeout(()=>{
        qIndex++;
        if(qIndex>=questions.length) finish();
        else loadQuestion();
      },2500);
    }
  }
}

function finish(){
  document.getElementById('s-claps').play().catch(()=>{});
  document.getElementById('viewport-root').innerHTML=
  `<div class="ins-box" style="margin:auto;text-align:center">
    <h2 class="ins-title">🏆 Quantity Quest Complete!</h2>
    <p class="ins-text" style="text-align:center">You completed all 10 Comparing Quantities challenges.<br><b>Final Stars: ${score}/10</b></p>
    <button class="action-btn" onclick="location.reload()">Play Again</button>
  </div>`;
}

function render(){
  if(!ctx) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  let w=canvas.width,h=canvas.height;

  /* floor + wall */
  let wall=ctx.createLinearGradient(0,0,0,h);
  wall.addColorStop(0,'#f8fafc');
  wall.addColorStop(.7,'#eef2ff');
  wall.addColorStop(1,'#ecfccb');
  ctx.fillStyle=wall;
  ctx.fillRect(0,0,w,h);

  /* subtle grid */
  ctx.strokeStyle='rgba(37,99,235,.10)';
  ctx.lineWidth=1;
  for(let x=0;x<w;x+=32){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,h);
    ctx.stroke();
  }
  for(let y=0;y<h;y+=32){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }

  /* top sign bar with no unwanted text */
  ctx.fillStyle='#ffedd5';
  ctx.fillRect(10,16,w-20,36);
  ctx.fillStyle='#fb923c';
  ctx.fillRect(10,50,w-20,6);

  /* hanging lights / coins for visual engagement */
  for(let i=0;i<3;i++){
    const cx=38+i*48;
    ctx.strokeStyle='rgba(148,163,184,.7)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx,0);
    ctx.lineTo(cx,16);
    ctx.stroke();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.arc(cx,24,8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#7c2d12';
    ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('₹',cx,27);
  }

  /* checkout counter */
  const counterX=w-104,counterY=h-90,counterW=82,counterH=58;
  ctx.fillStyle='#dbeafe';
  ctx.strokeStyle='#2563eb';
  ctx.lineWidth=3;
  ctx.fillRect(counterX,counterY,counterW,counterH);
  ctx.strokeRect(counterX,counterY,counterW,counterH);

  ctx.fillStyle='#2563eb';
  ctx.fillRect(counterX+10,counterY+10,62,6);

  ctx.fillStyle='#1d4ed8';
  ctx.textAlign='center';
  ctx.font='bold 12px sans-serif';
  ctx.fillText('CHECKOUT',counterX+counterW/2,counterY+33);
  ctx.font='bold 11px sans-serif';
  ctx.fillText('COUNTER',counterX+counterW/2,counterY+49);

  /* token bubble */
  ctx.fillStyle='#fbbf24';
  ctx.beginPath();
  ctx.arc(counterX+counterW/2,counterY-12,16,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#78350f';
  ctx.font='bold 12px sans-serif';
  ctx.fillText('%',counterX+counterW/2,counterY-8);

  /* route */
  const startX=24,startY=h-62;
  const turnX=w*.38;
  const turnY=h-62;
  const endX=counterX-12,endY=h-62;

  ctx.strokeStyle='#2563eb';
  ctx.lineWidth=5;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(startX,startY);
  ctx.lineTo(endX,endY);
  ctx.stroke();

  ctx.strokeStyle='#f59e0b';
  ctx.setLineDash([10,10]);
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(startX,startY);
  ctx.lineTo(endX,endY);
  ctx.stroke();
  ctx.setLineDash([]);

  /* decorative price tags */
  drawTag(28,78,'₹');
  drawTag(66,108,'%');
  drawTag(w-144,84,'₹');
  drawTag(w-170,122,'%');

  /* cart position */
  let sx=38,tx=counterX-28;
  let x=sx+(tx-sx)*cart.progress,y=h-62;

  ctx.save();
  ctx.translate(x+cart.ox,y+cart.oy);
  ctx.rotate(cart.rot);

  /* cart */
  ctx.strokeStyle='#2563eb';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-20,-12);
  ctx.lineTo(8,-12);
  ctx.lineTo(14,6);
  ctx.lineTo(-26,6);
  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle='#93c5fd';
  ctx.fillRect(-18,-10,22,12);
  ctx.fillStyle='#60a5fa';
  ctx.fillRect(-12,-18,12,8);

  /* items inside cart */
  ctx.fillStyle='#fbbf24';
  ctx.fillRect(-15,-18,7,8);
  ctx.fillStyle='#22c55e';
  ctx.fillRect(-5,-21,8,11);
  ctx.fillStyle='#fb7185';
  ctx.fillRect(4,-17,7,7);

  /* handle */
  ctx.beginPath();
  ctx.moveTo(8,-12);
  ctx.lineTo(16,-22);
  ctx.stroke();

  /* wheels */
  ctx.fillStyle='#111827';
  ctx.beginPath();
  ctx.arc(-14,10,6,0,Math.PI*2);
  ctx.arc(8,10,6,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  /* sparkle near checkout on success path */
  if(cart.moving){
    const pulse=.5+.5*Math.sin(Date.now()*.01);
    ctx.fillStyle='rgba(250,204,21,'+(0.15+0.2*pulse)+')';
    ctx.beginPath();
    ctx.arc(counterX-6,counterY+14,8+4*pulse,0,Math.PI*2);
    ctx.fill();
  }

  if(cart.crash){
    ctx.fillStyle='rgba(220,38,38,.28)';
    ctx.beginPath();
    ctx.arc(x+cart.ox,y+cart.oy,28,0,Math.PI*2);
    ctx.fill();
  }
}

function drawTag(x,y,txt){
  ctx.fillStyle='#ffffff';
  ctx.strokeStyle='#93c5fd';
  ctx.lineWidth=2;
  roundRect(x,y,24,20,6,true,true);
  ctx.fillStyle='#1d4ed8';
  ctx.font='bold 11px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(txt,x+12,y+14);
}

function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

function confetti(){
  for(let i=0;i<18;i++){
    let p=document.createElement('div');
    p.className='confetti';
    p.style.left=Math.random()*100+'vw';
    p.style.background=['#2563eb','#f59e0b','#16a34a','#ef4444'][Math.floor(Math.random()*4)];
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1600);
  }
}
</script>
</body>
</html>
